name: Trusty 1.0 CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  swift:
    name: Swift package
    # macOS 26: Shotnix builds against the macOS 26 SDK (SpeechAnalyzer for
    # captions), as releases do; the macOS 15 SDK can't compile it.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out Shotnix
        uses: actions/checkout@v6

      - name: Show the toolchain
        run: xcodebuild -version && swift --version

      # Most of the suite drives real windows, menus and mouse events, and on
      # the hosted runner some of those never return. CI checks that the app
      # and every test compile against the release SDK; the full suite runs
      # locally, in a logged-in session, before each release.
      - name: Build the app and the tests
        run: swift build --build-tests

      - name: Build release binary
        run: swift build -c release
