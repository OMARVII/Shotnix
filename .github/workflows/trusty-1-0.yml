name: Trusty 1.0 CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  swift:
    name: Swift package
    # macOS 26: Shotnix builds against the macOS 26 SDK (SpeechAnalyzer for
    # captions), as releases do; the macOS 15 SDK can't compile it.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out Shotnix
        uses: actions/checkout@v6

      - name: Show the toolchain
        run: xcodebuild -version && swift --version

      # The localized snapshot suites draw real windows in every language;
      # on the hosted runner one of them never returns, so they run locally
      # before each release instead.
      - name: Run Swift tests
        run: swift test --skip "CaptureLocalizationTests|LocalizedLayoutTests|VideoEditorLocalizedSnapshotTests|VideoFeatureLocalizationSnapshotTests"

      - name: Build release binary
        run: swift build -c release
